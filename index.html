            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            width: 100%;
            max-width: 393px;
            margin: 0 auto;
            padding: 10px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 18px;
        }
        .main-title {
            font-size: 20px;
            font-weight: 600;
            color: #e0f2fe;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }
        .contact-info {
            font-size: 8px;
            color: #bfdbfe;
            margin-top: 4px;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        section {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 10px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
        }
        .toggle-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .schedule-wrapper {
            transition: max-height 0.3s ease, opacity 0.3s ease;
            max-height: 500px;
            overflow: hidden;
            opacity: 1;
        }
        .schedule-wrapper.collapsed {
            max-height: 0;
            opacity: 0;
        }
        
        .schedule-scroll {
            max-height: 180px;
            overflow-y: auto;
            border-radius: 6px;
            -webkit-overflow-scrolling: touch;
            background: #1e293b;
        }
        table.schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9.5px;
            text-align: center;
        }
        table.schedule-table th {
            background-color: #1e293b !important; /* 배경을 불투명하게 고정하여 비침 현상 방지 */
            color: #38bdf8;
            position: sticky;
            top: 0;
            padding: 5px 2px;
            z-index: 10;
            font-size: 9.5px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
        }
        table.schedule-table td {
            padding: 4px 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-size: 9.5px;
            white-space: nowrap;
        }
        table.schedule-table td:first-child {
            font-weight: bold;
            color: #e0f2fe;
        }
        table.schedule-table tr:hover td {
            background: rgba(56, 189, 248, 0.2);
        }

        /* 구분선 처리 */
        table.schedule-table th:nth-child(2),
        table.schedule-table td:nth-child(2) {
            border-right: 1px solid rgba(56, 189, 248, 0.4);
            padding-right: 4px;
        }
        table.schedule-table th:nth-child(3),
        table.schedule-table td:nth-child(3) {
            padding-left: 4px;
        }

        /* 배우 필터 스타일 */
        .actor-filter-container {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }
        .actor-filter-title {
            font-size: 9px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .actor-filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .actor-btn {
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #cbd5e1;
            font-size: 8.5px;
            padding: 2px 6px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .actor-btn:hover, .actor-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }
        .form-group label {
            font-size: 10px;
            color: #cbd5e1;
            width: 70px;
            flex-shrink: 0;
        }
        .form-group input, .form-group select {
            flex: 1;
            padding: 5px 6px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 10px;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            margin-top: 4px;
        }

        .summary-info {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 10px;

            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 2px;
        }

            bottom: 4px;
            background: none;
            border: none;
            color: #ef4444;
            font-size: 9px;
            cursor: pointer;
        }

        .site-item {

            text-decoration: none;
            padding: 4px 6px;
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 4px;
            font-weight: bold;
        }

        .grade-legend {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 8.5px;
            margin-bottom: 6px;
            background: #1e293b;
            padding: 6px;
            border-radius: 4px;
        }
        .legend-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .g-item { display: flex; align-items: center; gap: 4px; }
        .g-dot { width: 8px; height: 8px; border-radius: 50%; }

        .c-vip { background-color: #a37549; color: #fff; }
        .c-r { background-color: #be2e2e; color: #fff; }
        .c-s { background-color: #3867b3; color: #fff; }
        .c-a { background-color: #4b8f46; color: #fff; }
        .c-disabled { background-color: #64748b; color: #fff; }
        .c-unassigned { background-color: #475569; color: #94a3b8; }

            background: rgba(226, 232, 240, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 9px;
            padding: 3px;

            font-weight: bold;
        }
        .floor-label {
            font-size: 10px;
            color: #e0f2fe;
            font-weight: 800;
            text-align: center;
            margin: 6px 0 2px 0;
        }

            border-radius: 6px;
            padding: 8px 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            -webkit-overflow-scrolling: touch;
        }

            display: flex;
            flex-direction: column;
            gap: 1.5px;
            align-items: center;
            min-width: 360px;
        }

        .seat-row-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .row-num {
            font-size: 6.5px;
            color: #94a3b8;
            width: 12px;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;

        .seat-section-block {
            display: flex;
            gap: 1px;
        }

        .aisle-space {
            width: 6px;
            flex-shrink: 0;
        }

        .seat-cell {
            width: 6.8px;
            height: 7.5px;
            border-radius: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.5);
            transition: background-color 0.2s;
        }

        .seat-cell.empty-space {
            background: transparent !important;
            box-shadow: none !important;
            cursor: default;
            pointer-events: none;
        }

        .seat-cell:not(.empty-space):hover {
            transform: scale(2.2);
            z-index: 99;
            box-shadow: 0 0 4px #ffffff;
        }

        .gap-222 {
            margin-right: 4px;

            { date: "2026-11-07", time: "19:00", elsa: "정선아", anna: "홍금비", kris: "차윤해", hans: "황건하", olaf: "정원영", weselton: "임진웅" },
            { date: "2026-11-08", time: "15:00", elsa: "정유지", anna: "박진주", kris: "신재범", hans: "김원빈", olaf: "이창호", weselton: "임진웅" }
        ];

        const orderedActorList = [
            "정선아", "정유지", "민경아", 
            "박진주", "홍금비", "최지혜", 
            "차윤해", "신재범", 
            "김원빈", "황건하", 
            "정원영", "한규정", "이창호", 
            "정열", "임진웅"
        ];

        let selectedActors = [];
        let myRecords = JSON.parse(localStorage.getItem('frozenCalcRecords')) || [];
        let seatWatchStatus = JSON.parse(localStorage.getItem('frozenSeatWatchStatus')) || {};

        window.onload = function() {
            initActorFilters();
            renderSchedule();
            updatePrice();
            renderRecords();
            buildGradeSeatMap();

            document.addEventListener('contextmenu', e => e.preventDefault());
        };

        function toggleSchedule() {
            const wrapper = document.getElementById('scheduleWrapper');
            const btn = document.getElementById('toggleScheduleBtn');
            if (wrapper.classList.contains('collapsed')) {
                wrapper.classList.remove('collapsed');
                btn.innerText = '접기 ▲';
            } else {
                wrapper.classList.add('collapsed');
                btn.innerText = '펼치기 ▼';
            }
        }

        function initActorFilters() {
            const actors = ["전체", ...orderedActorList];
            const container = document.getElementById('actorFilterButtons');
            container.innerHTML = '';

            actors.forEach(actor => {
                const btn = document.createElement('button');
                btn.className = `actor-btn ${actor === '전체' ? 'active' : ''}`;
                btn.innerText = actor;
                btn.onclick = () => toggleActorFilter(actor);
                container.appendChild(btn);
            });
        }

        function toggleActorFilter(actor) {
            if (actor === "전체") {
                selectedActors = [];
            } else {
                const idx = selectedActors.indexOf(actor);
                if (idx > -1) {
                    selectedActors.splice(idx, 1);
                } else {
                    if (selectedActors.length >= 2) {
                        alert("배우는 최대 2명까지 지정 선택이 가능합니다.");
                        return;
                    }
                    selectedActors.push(actor);
                }
            }

            document.querySelectorAll('.actor-btn').forEach(btn => {
                const bText = btn.innerText;
                if (selectedActors.length === 0) {
                    if (bText === "전체") btn.classList.add('active');
                    else btn.classList.remove('active');
                } else {
                    if (selectedActors.includes(bText)) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });

            renderSchedule();
        }

        function renderSchedule() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            const filteredSchedule = fullSchedule.filter(item => {
                if (selectedActors.length === 0) return true;
                const cast = [item.elsa, item.anna, item.kris, item.hans, item.olaf, item.weselton];
                return selectedActors.every(actor => cast.includes(actor));
            });

            filteredSchedule.forEach(item => {
                const dateObj = new Date(item.date);
                const dayName = days[dateObj.getDay()];

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date.slice(5)}(${dayName})</td>
                    <td>${item.time}</td>
                    <td style="${selectedActors.includes(item.elsa) ? 'color:#38bdf8; font-weight:bold;' : ''}">${item.elsa}</td>
                    <td style="${selectedActors.includes(item.anna) ? 'color:#38bdf8; font-weight:bold;' : ''}">${item.anna}</td>
                    <td style="${selectedActors.includes(item.kris) ? 'color:#38bdf8; font-weight:bold;' : ''}">${item.kris}</td>
                    <td style="${selectedActors.includes(item.hans) ? 'color:#38bdf8; font-weight:bold;' : ''}">${item.hans}</td>
                    <td style="${selectedActors.includes(item.olaf) ? 'color:#38bdf8; font-weight:bold;' : ''}">${item.olaf}</td>
                    <td style="${selectedActors.includes(item.weselton) ? 'color:#38bdf8; font-weight:bold;' : ''}">${item.weselton}</td>
                `;
                tr.onclick = () => {
                    document.getElementById('watchDate').value = `${item.date}(${dayName}) ${item.time}`;
                };
                tbody.appendChild(tr);
            });
        }

        function updatePrice() {
            const gradePrice = parseInt(document.getElementById('seatGrade').value);
            const discountSelect = document.getElementById('discountType');
            const discountRate = parseFloat(discountSelect.value);
            const ticketCount = parseInt(discountSelect.options[discountSelect.selectedIndex].getAttribute('data-count') || '1');
            const feePerTicket = 2000;

            const baseTotal = gradePrice * ticketCount;
            const calculated = Math.floor(baseTotal * (1 - discountRate)) + (feePerTicket * ticketCount);
            
            document.getElementById('finalPriceDisplay').value = `${calculated.toLocaleString()}원 (수수료 포함)`;
            return calculated;
        }

        function addRecord() {
            const dateVal = document.getElementById('watchDate').value;
            const seatVal = document.getElementById('selectSeat').value;
            const priceVal = updatePrice();

            if (!dateVal || !seatVal) return;

            const record = {
                id: Date.now(),
                datetime: dateVal,
                seat: seatVal,
                price: priceVal
            };

            myRecords.push(record);
            localStorage.setItem('frozenCalcRecords', JSON.stringify(myRecords));
            
            const seatKey = seatVal.split(' (')[0];
            const currentCount = seatWatchStatus[seatKey] || 0;
            seatWatchStatus[seatKey] = currentCount + 1;
            localStorage.setItem('frozenSeatWatchStatus', JSON.stringify(seatWatchStatus));

            renderRecords();
            buildGradeSeatMap();
            document.getElementById('selectSeat').value = '';
        }

        function renderRecords() {
            const container = document.getElementById('recordContainer');
            container.innerHTML = '';

            let total = 0;
            myRecords.forEach((item) => {
                total += item.price;

                const card = document.createElement('div');
                card.className = 'record-card';
                card.innerHTML = `
                    <div class="record-header">
                        <span>${item.datetime}</span>
                        <span class="record-price" style="color:#38bdf8;">${item.price.toLocaleString()}원</span>
                    </div>
                    <div>좌석: ${item.seat}</div>
                    <button class="delete-btn" onclick="deleteRecord(${item.id})">삭제</button>
                `;
                container.appendChild(card);
            });

            document.getElementById('totalCount').innerText = myRecords.length;
            document.getElementById('totalAmount').innerText = total.toLocaleString();
        }

        function deleteRecord(id) {
            const target = myRecords.find(r => r.id === id);
            if (target) {
                const seatKey = target.seat.split(' (')[0];
                if (seatWatchStatus[seatKey] && seatWatchStatus[seatKey] > 0) {
                    seatWatchStatus[seatKey] -= 1;
                    if (seatWatchStatus[seatKey] === 0) delete seatWatchStatus[seatKey];
                    localStorage.setItem('frozenSeatWatchStatus', JSON.stringify(seatWatchStatus));
                }
            }
            myRecords = myRecords.filter(r => r.id !== id);
            localStorage.setItem('frozenCalcRecords', JSON.stringify(myRecords));
            renderRecords();
            buildGradeSeatMap();
        }

        function createRange(start, end, excludes = []) {
            const arr = [];
            for (let i = start; i <= end; i++) {
                if (excludes.includes(i)) continue;
                arr.push(i);
            }
            return arr;
        }

        function splitSeatRow(nums) {
            const a = [], b = [], c = [];
            nums.forEach(n => {
                if (typeof n === 'number') {
                    if (n <= 14) a.push(n);
                    else if (n <= 30) b.push(n);
                    else c.push(n);
                } else {
                    if (n.refNum <= 14) a.push(n);
                    else if (n.refNum <= 30) b.push(n);
                    else c.push(n);
                }
            });
            return { a, b, c };
        }

        function buildGradeSeatMap() {
            const map1F = document.getElementById('seatMap1F');
            map1F.innerHTML = '';

            const raw1F = [
                { row: 'OP', range: createRange(15, 30) },
                { row: '1', range: createRange(12, 33, [30]) },
                { row: '2', range: createRange(11, 34) },
                { row: '3', range: createRange(10, 35, [30]) },
                { row: '4', range: createRange(9, 36) },
                { row: '5', range: createRange(8, 37, [30]) },
                { row: '6', range: createRange(7, 38) },
                { row: '7', range: createRange(7, 38, [30]) },
                { row: '8', range: createRange(6, 39) },
                { row: '9', range: createRange(5, 40, [30]) },
                { row: '10', range: createRange(5, 40) },
                { row: '11', range: createRange(4, 41, [30]) },
                { row: '12', range: createRange(3, 42) },
                { row: '13', range: createRange(3, 42, [30]) },
                { row: '14', range: createRange(2, 43) },
                { row: '15', range: createRange(1, 44, [30]) },
                { row: '16', range: createRange(1, 44) },
                { row: '17', range: createRange(1, 44, [30]) },
                { row: '18', range: createRange(1, 44) },
                { row: '19', range: createRange(1, 44, [30]) },
                { row: '20', range: createRange(1, 44) },
                { row: '21', range: [19, 20, 22, 23, 25, 26], isGrouped222: true }
            ];

            const data1F = raw1F.map(item => {
                const split = splitSeatRow(item.range);
                return {
                    row: item.row,
                    a: split.a,
                    b: split.b,
                    c: split.c,
                    isGrouped222: !!item.isGrouped222
                };
            });

            const range12F = [];
            for (let i = 1; i <= 44; i++) {
                if (i === 30) continue;
                if (i === 17 || i === 27) {
                    range12F.push({ isEmpty: true, refNum: i });
                } else {
                    range12F.push(i);
                }
            }

            const raw2F = [
                { row: '1', range: createRange(2, 43) },
                { row: '2', range: createRange(2, 43, [30]) },
                { row: '3', range: createRange(1, 44) },
                { row: '4', range: createRange(1, 44, [30]) },
                { row: '5', range: createRange(1, 44) },
                { row: '6', range: createRange(1, 44, [30]) },
                { row: '7', range: createRange(1, 44) },
                { row: '8', range: createRange(1, 44, [30]) },
                { row: '9', range: createRange(1, 44) },
                { row: '10', range: createRange(1, 44, [30]) },
                { row: '11', range: createRange(1, 44) },
                { row: '12', range: range12F }
            ];

            const data2F = raw2F.map(item => {
                const split = splitSeatRow(item.range);
                return {
                    row: item.row,
                    a: split.a,
                    b: split.b,
                    c: split.c
                };
            });

            renderFloorRows(map1F, data1F, '1층');
            renderFloorRows(document.getElementById('seatMap2F'), data2F, '2층');
        }

        function getGradeFromImage(floor, row, num) {
            if (floor === '1층') {
                if (row === 'OP') {
                    if (num >= 20 && num <= 25) return { cls: 'c-unassigned', label: '미판매석' };
                    return { cls: 'c-vip', label: 'VIP석' };
                }

                const rNum = parseInt(row);

                if (row === '1' && ((num >= 12 && num <= 14) || (num >= 31 && num <= 33))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '2' && ((num >= 11 && num <= 12) || (num >= 33 && num <= 34))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '3' && ((num >= 10 && num <= 11) || (num >= 34 && num <= 35))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '4' && ((num >= 9 && num <= 10) || (num >= 35 && num <= 36))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '5' && ((num >= 8 && num <= 9) || (num >= 36 && num <= 37))) return { cls: 'c-unassigned', label: '미판매석' };
                if ((row === '6' || row === '7') && ((num >= 7 && num <= 8) || (num >= 37 && num <= 38))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '8' && ((num >= 6 && num <= 7) || (num >= 38 && num <= 39))) return { cls: 'c-unassigned', label: '미판매석' };
                if ((row === '9' || row === '10') && ((num >= 5 && num <= 6) || (num >= 39 && num <= 40))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '11' && ((num >= 4 && num <= 5) || (num >= 40 && num <= 41))) return { cls: 'c-unassigned', label: '미판매석' };
                if ((row === '12' || row === '13') && ((num >= 3 && num <= 4) || (num >= 41 && num <= 42))) return { cls: 'c-unassigned', label: '미판매석' };

                if (row === '20' && ((num >= 9 && num <= 14) || (num >= 31 && num <= 37))) {
                    return { cls: 'c-disabled', label: '장애인석' };
                }

                if (rNum >= 1 && rNum <= 18) {
                    if (num >= 8 && num <= 37) return { cls: 'c-vip', label: 'VIP석' };
                    return { cls: 'c-r', label: 'R석' };
                }
                return { cls: 'c-r', label: 'R석' };
            }

            if (floor === '2층') {
                const rNum = parseInt(row);

                if (row === '1' && [2, 3, 4, 41, 42, 43].includes(num)) {
                    return { cls: 'c-unassigned', label: '미판매석' };
                }

                if (row === '1') {
                    if ((num >= 5 && num <= 8) || (num >= 37 && num <= 40)) return { cls: 'c-r', label: 'R석' };
                    return { cls: 'c-vip', label: 'VIP석' };
                }

                if (row === '2') {
                    if ((num >= 2 && num <= 8) || (num >= 37 && num <= 43)) return { cls: 'c-r', label: 'R석' };
                    return { cls: 'c-vip', label: 'VIP석' };
                }

                if (rNum >= 3 && rNum <= 5) return { cls: 'c-r', label: 'R석' };
                if (rNum >= 6 && rNum <= 10) return { cls: 'c-s', label: 'S석' };
                if (rNum >= 11 && rNum <= 12) return { cls: 'c-a', label: 'A석' };
            }

            return { cls: 'c-vip', label: 'VIP석' };
        }

        function renderFloorRows(targetElem, floorData, floorTitle) {
            targetElem.innerHTML = '';

            floorData.forEach(rData => {
                const rowWrapper = document.createElement('div');
                rowWrapper.className = 'seat-row-wrapper';

                const rowNum = document.createElement('div');
                rowNum.className = 'row-num';
                rowNum.innerText = rData.row;
                rowWrapper.appendChild(rowNum);

                ['a', 'b', 'c'].forEach((secKey, idx) => {
                    const secBlock = document.createElement('div');
                    secBlock.className = 'seat-section-block';

                    const secName = secKey === 'a' ? 'A구역' : (secKey === 'b' ? 'B구역' : 'C구역');
                    const seatArr = rData[secKey];

                    seatArr.forEach((item, sIdx) => {
                        const cell = document.createElement('div');
                        
                        if (typeof item === 'object' && item.isEmpty) {
                            cell.className = 'seat-cell empty-space';
                            secBlock.appendChild(cell);
                            return;
                        }

                        const num = item;
                        const gInfo = getGradeFromImage(floorTitle, rData.row, num);
                        const seatKey = `${floorTitle} ${secName} ${rData.row}열 ${num}번`;
                        
                        const watchCount = seatWatchStatus[seatKey] || 0;
                        let watchClass = '';
                        if (watchCount === 1) watchClass = 'c-watch-1';
                        else if (watchCount === 2) watchClass = 'c-watch-2';
                        else if (watchCount >= 3) watchClass = 'c-watch-3';

                        cell.className = `seat-cell ${watchClass || gInfo.cls}`;
                        if (rData.isGrouped222 && (sIdx === 1 || sIdx === 3)) {
                            cell.classList.add('gap-222');
                        }
                        cell.innerText = num;

                        cell.onclick = () => {
                            document.getElementById('selectSeat').value = `${seatKey} (${gInfo.label})`;
                            
                            const selectGrade = document.getElementById('seatGrade');
                            if (gInfo.label === 'VIP석') selectGrade.value = '190000';
                            else if (gInfo.label === 'R석') selectGrade.value = '160000';
                            else if (gInfo.label === 'S석') selectGrade.value = '130000';
                            else if (gInfo.label === 'A석') selectGrade.value = '90000';
                            updatePrice();
                        };

                        secBlock.appendChild(cell);
                    });

                    rowWrapper.appendChild(secBlock);

                    if (idx < 2) {
                        const aisle = document.createElement('div');
                        aisle.className = 'aisle-space';
                        rowWrapper.appendChild(aisle);
                    }
                });

                targetElem.appendChild(rowWrapper);
            });
        }
    </script>
</body>
